version: '3.8'

services:
  hobbytrack:
    build: 
      context: .
      args:
        - VITE_CLERK_PUBLISHABLE_KEY=${VITE_CLERK_PUBLISHABLE_KEY}
    container_name: hobbytrack-app
    ports:
      - "8000:8000"
    volumes:
      # SQLite database persistence
      - hobbytrack_data:/app/data
    environment:
      - ENV=production
      - PYTHONPATH=/app
      # Clerk environment variables for backend
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
      - CLERK_PUBLISHABLE_KEY=${CLERK_PUBLISHABLE_KEY}
      - CLERK_JWKS_URL=${CLERK_JWKS_URL}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  hobbytrack_data:
    driver: local 